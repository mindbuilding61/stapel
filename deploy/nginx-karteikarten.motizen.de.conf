# Beispiel Reverse-Proxy für karteikarten.motizen.de
# Auf dem Server unter /etc/nginx/sites-available/ ablegen und freischalten.

server {
    listen 80;
    server_name karteikarten.motizen.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name karteikarten.motizen.de;

    # Zertifikat anpassen (Let's Encrypt o.ä.)
    ssl_certificate     /etc/letsencrypt/live/karteikarten.motizen.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/karteikarten.motizen.de/privkey.pem;

    client_max_body_size 42M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
